<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>2026 股票大赛 · YTD Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
/* ── Variables ── */
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#242736;--border:#2e3347;
  --text:#e2e8f0;--text2:#94a3b8;--green:#22c55e;--red:#ef4444;--accent:#6366f1;
  --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}

/* ── Header ── */
.header{
  background:linear-gradient(135deg,#1e1b4b 0%,#0f1117 60%);
  border-bottom:1px solid var(--border);
  padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.header-left h1{font-size:18px;font-weight:700;}
.header-left h1 span{color:var(--accent);}
.header-left .sub{font-size:11px;color:var(--text2);margin-top:2px;}
.header-right{text-align:right;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:600;}
.badge-live{background:#14532d;color:#4ade80;}
.badge-sim{background:#78350f;color:#fcd34d;}
.badge-loading{background:#1e3a5f;color:#93c5fd;animation:pulse 1.2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.rfbtn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:4px 10px;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;margin-top:4px;}
.rfbtn:hover{background:var(--accent);color:#fff;}

/* ── KPI Strip ── */
.kpi-strip{
  display:flex;gap:10px;padding:14px 16px;overflow-x:auto;
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
.kpi-strip::-webkit-scrollbar{display:none;}
.kpi-pill{
  flex:0 0 auto;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:10px 16px;min-width:130px;
}
.kpi-label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:4px;}
.kpi-val{font-size:20px;font-weight:700;}
.kpi-val.pos{color:var(--green);} .kpi-val.neg{color:var(--red);}
.kpi-sub{font-size:10px;color:var(--text2);margin-top:2px;}

/* ── Bottom Nav (mobile) ── */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg2);border-top:1px solid var(--border);
  height:var(--nav-h);z-index:200;
  display:flex;
}
.nav-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;color:var(--text2);font-size:10px;font-weight:600;
  border:none;background:transparent;transition:color .15s;padding:8px 0;
}
.nav-tab .icon{font-size:20px;line-height:1;}
.nav-tab.active{color:var(--accent);}
.nav-tab.active .icon{transform:scale(1.1);}

/* ── Page sections ── */
.page{display:none;padding-bottom:20px;}
.page.active{display:block;}

/* ── Section title ── */
.sec{font-size:12px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;
  color:var(--text2);padding:16px 16px 10px;border-bottom:1px solid var(--border);}

/* ── Rankings: mobile card list ── */
.rank-list{padding:10px;display:flex;flex-direction:column;gap:8px;}
.rank-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:border-color .2s;
}
.rank-card:hover,.rank-card:active{border-color:var(--accent);}
.rank-card-top{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
}
.rank-num{font-size:11px;font-weight:700;color:var(--text2);min-width:18px;text-align:center;}
.rank-medal{font-size:16px;min-width:18px;text-align:center;}
.rank-info{flex:1;min-width:0;}
.rank-ticker{font-size:17px;font-weight:800;}
.rank-name{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-right{text-align:right;}
.rank-ytd{font-size:20px;font-weight:800;}
.rank-prices{font-size:11px;color:var(--text2);font-family:monospace;margin-top:1px;}
.rank-expand{display:none;border-top:1px solid var(--border);}
.rank-chart-area{padding:0;height:160px;}
.rank-reason{padding:8px 14px 12px;font-size:11px;color:var(--text2);}
.rank-card.open .rank-expand{display:block;}
.rank-card.open{border-color:var(--accent);}

/* ── Leaderboard: desktop table ── */
.lb-wrap{overflow:auto;}
.lb-table{width:100%;border-collapse:collapse;min-width:700px;}
.lb-table th{background:var(--bg3);padding:10px 14px;font-size:11px;font-weight:600;
  color:var(--text2);text-align:left;text-transform:uppercase;letter-spacing:.7px;white-space:nowrap;}
.lb-table td{padding:10px 14px;font-size:13px;border-top:1px solid var(--border);}
.lb-table tr:hover td{background:var(--bg3);cursor:pointer;}
.rb{display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:6px;font-size:11px;font-weight:700;}
.r1{background:#78350f;color:#fcd34d;} .r2{background:#1e3a5f;color:#93c5fd;}
.r3{background:#1a2e1a;color:#86efac;} .rn{background:var(--bg3);color:var(--text2);}
.pos-t{color:var(--green);font-weight:700;} .neg-t{color:var(--red);font-weight:700;}
.mono{font-family:monospace;font-size:13px;}
.sec-tag{font-size:10px;background:var(--bg3);color:var(--text2);padding:2px 7px;border-radius:999px;}

/* ── Compare tab ── */
.compare-wrap{padding:14px;}
.picker-label{font-size:12px;color:var(--text2);margin-bottom:10px;}
.ticker-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{
  padding:6px 14px;border-radius:999px;border:1px solid var(--border);
  background:transparent;color:var(--text2);font-size:12px;font-weight:600;
  cursor:pointer;transition:all .15s;
}
.chip.sel{color:#fff;border-color:transparent;}
.chip:hover{border-color:var(--accent);}
.cmp-chart-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tb{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;
  color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}
.tb.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ── Desktop grid ── */
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;padding:14px;}
.stock-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s;}
.stock-card:hover{border-color:var(--accent);}
.card-hdr{padding:12px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border);}
.ct{font-size:17px;font-weight:800;} .cn{font-size:11px;color:var(--text2);margin-top:1px;}
.cs{font-size:10px;background:var(--bg3);color:var(--text2);padding:2px 7px;border-radius:999px;margin-top:3px;display:inline-block;}
.cr{text-align:right;} .cy{font-size:21px;font-weight:800;}
.cp{font-size:11px;color:var(--text2);margin-top:1px;font-family:monospace;}
.ck{font-size:10px;color:var(--text2);margin-top:3px;}

/* ── Footer ── */
.footer{padding:16px;text-align:center;font-size:11px;color:var(--text2);
  border-top:1px solid var(--border);}

/* ═══════════════════════════════════════════════
   RESPONSIVE BREAKPOINTS
   ═══════════════════════════════════════════════ */

/* ── MOBILE (≤ 768px) ── */
@media (max-width:768px) {
  body{padding-bottom:var(--nav-h);}

  /* Hide desktop comparison section + grid */
  #desktop-compare{display:none;}
  #desktop-grid{display:none;}

  /* Show mobile bottom nav */
  .bottom-nav{display:flex;}

  /* Rankings page shows mobile cards */
  #page-ranks .lb-wrap{display:none;}
  #page-ranks .rank-list{display:flex;}

  /* Compare + Charts pages visible via tab */
  .kpi-pill{min-width:110px;}
  .kpi-val{font-size:17px;}
}

/* ── DESKTOP (> 768px) ── */
@media (min-width:769px) {
  /* Always show all pages stacked */
  .page{display:block !important;}

  /* Hide mobile-only elements */
  .bottom-nav{display:none !important;}
  .rank-list{display:none;}

  /* Show desktop table */
  #page-ranks .lb-wrap{display:block;}

  /* KPI strip becomes a 4-column grid */
  .kpi-strip{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:12px;padding:16px 20px;overflow:visible;
  }
  .kpi-pill{min-width:0;}

  .sec{padding:18px 20px 12px;}
  .compare-wrap,.stock-grid{padding:16px 20px;}
  .rank-list{padding:16px 20px;}
}
</style>
</head>

<!-- ── Header ── -->
<div class="header">
  <div class="header-left">
    <h1>🏆 2026 <span>股票大赛</span></h1>

</div>

<!-- ══════════ PAGE: CHARTS (mobile) ══════════ -->
<div class="page" id="page-charts">
  <div class="sec">📉 Individual Price Curves</div>
  <div style="padding:10px;display:flex;flex-direction:column;gap:12px;" id="mobile-charts"></div>
</div>

<!-- ── Bottom Nav ── -->
<nav class="bottom-nav">
  <button class="nav-tab active" id="nav-ranks" onclick="switchTab('ranks')">
    <span class="icon">📊</span>Rankings
  </button>
  <button class="nav-tab" id="nav-compare" onclick="switchTab('compare')">

  <button class="nav-tab" id="nav-charts" onclick="switchTab('charts')">
    <span class="icon">📉</span>Charts
  </button>
</nav>

/* ── KPI Strip ── */
function renderKPIs() {
  const voo=BM.ytd, w=ST.filter(s=>s.ytd>0), l=ST.filter(s=>s.ytd<0);
  const eq=(ST.reduce((a,s)=>a+s.ytd,0)/ST.length).toFixed(2);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi-pill">
      <div class="kpi-label">Equal Weight</div>
      <div class="kpi-val ${eq>=0?'pos':'neg'}">${eq>=0?'+':''}${eq}%</div>
      <div class="kpi-sub">VOO: ${voo>=0?'+':''}${voo.toFixed(2)}%</div>
    </div>
    <div class="kpi-pill">
      <div class="kpi-label">🥇 Best</div>
      <div class="kpi-val pos">+${ST[0].ytd.toFixed(2)}%</div>
      <div class="kpi-sub">${ST[0].ticker}</div>
    </div>
    <div class="kpi-pill">
      <div class="kpi-label">Worst</div>
      <div class="kpi-val neg">${ST[ST.length-1].ytd.toFixed(2)}%</div>
      <div class="kpi-sub">${ST[ST.length-1].ticker}</div>
    </div>
    <div class="kpi-pill">
      <div class="kpi-label">Win / Loss</div>
      <div class="kpi-val" style="color:var(--text);font-size:18px">${w.length}<span style="color:var(--green)">▲</span> ${l.length}<span style="color:var(--red)">▼</span></div>
      <div class="kpi-sub">of ${ST.length} stocks</div>
    </div>`;
}

/* ── Mobile: rank cards ── */
function renderRankList() {
  const medals = ['🥇','🥈','🥉'];
  const list = document.getElementById('rank-list');
  list.innerHTML = '';
  ST.forEach((s,i) => {
    const pos = s.ytd >= 0;
    const div = document.createElement('div');
    div.className = 'rank-card';
    div.id = 'rc-'+s.ticker;
    div.innerHTML = `
      <div class="rank-card-top" onclick="toggleCard('${s.ticker}')">
        <div class="rank-medal">${i<3?medals[i]:''}</div>
        <div class="rank-num" style="color:${C[i]}">${s.rank}</div>
        <div class="rank-info">
          <div class="rank-ticker" style="color:${C[i]}">${s.ticker}</div>
          <div class="rank-name">${s.name}</div>
        </div>
        <div class="rank-right">
          <div class="rank-ytd" style="color:${pos?'#22c55e':'#ef4444'}">${pos?'+':''}${s.ytd.toFixed(2)}%</div>
          <div class="rank-prices">$${s.start} → $${s.end.toLocaleString()}</div>
        </div>
      </div>
      <div class="rank-expand">
        <div class="rank-chart-area" id="rcc-${s.ticker}"></div>
        <div class="rank-reason">💡 ${s.reason}</div>
      </div>`;
    list.appendChild(div);

}

function toggleCard(ticker) {
  const card = document.getElementById('rc-'+ticker);
  const wasOpen = card.classList.contains('open');
  // Close all
  document.querySelectorAll('.rank-card').forEach(c => c.classList.remove('open'));
  if (!wasOpen) {
    card.classList.add('open');
    // Render chart if not yet done
    const chartEl = document.getElementById('rcc-'+ticker);
    if (!chartEl.children.length) {
      const s = ST.find(x=>x.ticker===ticker);
      const i = ST.indexOf(s);
      const cl = {...BL, margin:{t:4,b:28,l:42,r:8}, showlegend:false,
        legend:{...BL.legend},
        xaxis:{...BL.xaxis,tickfont:{size:9}},
        yaxis:{...BL.yaxis} };
      Plotly.newPlot(chartEl,[
        {x:BM.dates,y:BM.ytd_pct,name:'VOO',type:'scatter',mode:'lines',
          line:{color:'#4b5563',width:1.2,dash:'dot'},
          hovertemplate:`VOO: %{y:.2f}%<extra></extra>`},
        {x:s.dates,y:s.ytd_pct,name:ticker,type:'scatter',mode:'lines',fill:'tozeroy',
          fillcolor:s.ytd>=0?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)',
          line:{color:C[i],width:2.5},
          hovertemplate:`${ticker}: %{y:.2f}%<extra></extra>`}
      ],cl,{responsive:true,displayModeBar:false});
    }
    card.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
}

/* ── Desktop: leaderboard table ── */
function renderTable() {
  const voo=BM.ytd;
  document.getElementById('lbody').innerHTML = ST.map((s,i) => {
    const vs=(s.ytd-voo).toFixed(2);
    const rc=i===0?'r1':i===1?'r2':i===2?'r3':'rn';
    return `<tr onclick="scrollToDesktopCard('${s.ticker}')">
      <td><span class="rb ${rc}">${s.rank}</span></td>
      <td><b style="color:${C[i]}">${s.ticker}</b> <span style="color:var(--text2);font-size:11px">${s.name}</span></td>
      <td><span class="sec-tag">${s.sector}</span></td>
      <td class="mono">$${s.start.toLocaleString()}</td>
      <td class="mono">$${s.end.toLocaleString()}</td>
      <td class="${s.ytd>=0?'pos-t':'neg-t'}">${s.ytd>=0?'+':''}${s.ytd.toFixed(2)}%</td>
      <td style="color:${vs>=0?'#22c55e':'#ef4444'};font-weight:600">${vs>=0?'+':''}${vs}%</td>
      <td style="color:var(--text2);font-size:12px;max-width:240px">${s.reason}</td>
    </tr>`;
  }).join('');
}

/* ── Desktop: comparison chart ── */
let cf='all';
function cmp(f,force){
  if(f===cf&&!force)return; cf=f;
  document.querySelectorAll('.tb').forEach((b,i)=>b.classList.toggle('active',['all','win','los'][i]===f));
  let fs=ST;
  if(f==='win')fs=ST.filter(s=>s.ytd>0);
  if(f==='los')fs=ST.filter(s=>s.ytd<0);
  const tr=fs.map(s=>{const i=ST.indexOf(s);return{
    x:s.dates,y:s.ytd_pct,name:s.ticker,type:'scatter',mode:'lines',
    line:{color:C[i],width:1.8},
    hovertemplate:`<b>${s.ticker}</b> %{y:.2f}%<extra></extra>`}});
  tr.push({x:BM.dates,y:BM.ytd_pct,name:'VOO',type:'scatter',mode:'lines',
    line:{color:'#94a3b8',width:2,dash:'dot'},
    hovertemplate:`VOO: %{y:.2f}%<extra></extra>`});
  Plotly.react('cmp-chart',tr,BL,{responsive:true,displayModeBar:false});
}

/* ── Mobile: compare tab with chip picker ── */
let selTickers = new Set(['CRCL','NVDA','TSLA','VOO']);
let mobileCompareRendered = false;

function renderChips() {
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  [...ST.map(s=>s.ticker),'VOO'].forEach(tk => {
    const i = ST.findIndex(s=>s.ticker===tk);
    const col = i>=0 ? C[i] : '#94a3b8';
    const btn = document.createElement('button');
    btn.className = 'chip' + (selTickers.has(tk)?' sel':'');
    btn.textContent = tk;
    if(selTickers.has(tk)) btn.style.background = col;
    btn.onclick = () => {
      if(selTickers.has(tk)){ selTickers.delete(tk); btn.classList.remove('sel'); btn.style.background=''; }
      else { selTickers.add(tk); btn.classList.add('sel'); btn.style.background=col; }
      renderMobileCompare();
    };
    wrap.appendChild(btn);
  });
}

function renderMobileCompare() {
  renderChips();
  const selected = [...selTickers];
  const traces = selected.map(tk => {
    const s = tk==='VOO' ? null : ST.find(x=>x.ticker===tk);
    const i = ST.findIndex(x=>x.ticker===tk);
    const col = s ? C[i] : '#94a3b8';
    const d = s || BM;
    return {x:d.dates, y:d.ytd_pct, name:tk, type:'scatter', mode:'lines',
      line:{color:col, width: tk==='VOO'?1.5:2, dash: tk==='VOO'?'dot':'solid'},
      hovertemplate:`<b>${tk}</b> %{y:.2f}%<extra></extra>`};
  });
  const mobLayout = {...BL, margin:{t:8,b:36,l:46,r:8},
    legend:{...BL.legend,orientation:'h',y:-0.15} };
  Plotly.react('cmp-chart-mob', traces, mobLayout, {responsive:true,displayModeBar:false});
}

/* ── Live data fetch ── */
async function tryFetch(url){
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}
async function fetchYahoo(ticker){
  const yUrl=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=ytd`;
  const proxies=[
    `https://corsproxy.io/?url=${encodeURIComponent(yUrl)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(yUrl)}`,
    yUrl
  ];
  for(const p of proxies){
    try{
      let json=await tryFetch(p);
      if(typeof json.contents==='string') json=JSON.parse(json.contents);
      const res=json?.chart?.result?.[0];
      if(!res) continue;
      const ts=res.timestamp, cl=res.indicators?.quote?.[0]?.close;
      if(!ts||!cl) continue;
      const valid=ts.map((t,i)=>[new Date(t*1000).toISOString().slice(0,10),cl[i]]).filter(([,p])=>p!=null);
      if(valid.length<5) continue;
      return{dates:valid.map(x=>x[0]),prices:valid.map(x=>Math.round(x[1]*100)/100)};
    }catch(e){continue;}
  }
  return null;
}

async function loadLive(){
  const badge=document.getElementById('badge');
  badge.className='badge badge-loading'; badge.textContent='⏳ Loading…';
  let ok=0; const raw={};
  await Promise.all([...ST.map(s=>s.ticker),'VOO'].map(async tk=>{
    const d=await fetchYahoo(tk);
    if(d){raw[tk]=d;ok++;}
  }));
  if(ok<3){
    badge.className='badge badge-sim'; badge.innerHTML='⚠ Simulated data';
    document.getElementById('fsrc').textContent='Simulated (Brownian bridge)';
    renderAll(); return;
  }
  const today=new Date().toISOString().slice(0,10);
  const newST=ES.map(s=>{
    const lv=raw[s.ticker]; if(!lv) return s;
    const d0=D0[s.ticker];
    const dates=['2025-12-31',...lv.dates];
    const prices=[d0,...lv.prices];
    const ytd_pct=prices.map(p=>Math.round((p/d0-1)*10000)/100);
    return{...s,dates,prices,ytd_pct,end:prices[prices.length-1],ytd:ytd_pct[ytd_pct.length-1]};
  });
  newST.sort((a,b)=>b.ytd-a.ytd); newST.forEach((s,i)=>s.rank=i+1);
  const vl=raw['VOO'];
  let newBM=EB;
  if(vl){
    const d0=D0['VOO'],dates=['2025-12-31',...vl.dates],prices=[d0,...vl.prices];
    const ytd_pct=prices.map(p=>Math.round((p/d0-1)*10000)/100);
    newBM={...EB,dates,prices,ytd_pct,end:prices[prices.length-1],ytd:ytd_pct[ytd_pct.length-1]};
  }
  ST=newST; BM=newBM;
  document.getElementById('fdate').textContent=today;
  document.getElementById('fsrc').textContent=`Yahoo Finance (live) · ${ok} tickers`;
  badge.className='badge badge-live'; badge.innerHTML=`✅ Live · ${today}`;
  renderAll();
}

/* ── Master render ── */
function renderAll(){
  renderKPIs();
  renderRankList();
  renderTable();
  cmp('all',true);
  renderDesktopGrid();
  mobileCompareRendered=false;
  mobileChartsRendered=false;
}

renderAll();
loadLive();
</script>
