async function tryFetch(url) {
  const r = await fetch(url, {headers:{'Accept':'application/json'}});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function fetchYahoo(ticker) {
  const yUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=ytd`;
  const proxies = [
    `https://corsproxy.io/?url=${encodeURIComponent(yUrl)}`,
    `https://api.allorigins.win/get?url=${encodeURIComponent(yUrl)}`,
    yUrl   // direct last — may work on some networks
  ];
  for (const p of proxies) {
    try {
      let json = await tryFetch(p);
      // allorigins wraps in {contents:...}
      if (typeof json.contents === 'string') json = JSON.parse(json.contents);
      const res = json?.chart?.result?.[0];
      if (!res) continue;
      const ts = res.timestamp;
      const cl = res.indicators?.quote?.[0]?.close;
      if (!ts || !cl) continue;
      const valid = ts.map((t,i)=>[new Date(t*1000).toISOString().slice(0,10), cl[i]])
                      .filter(([,p])=>p!=null);
      if (valid.length < 5) continue;
      return { dates: valid.map(x=>x[0]), prices: valid.map(x=>Math.round(x[1]*100)/100) };
    } catch(e) { continue; }
  }
  return null;
}

async function loadLive() {
  const badge = document.getElementById('badge');
  badge.className = 'badge badge-loading';
  badge.textContent = '⏳ Fetching live data…';
  let ok = 0;
  const raw = {};
  await Promise.all(TICKERS.map(async tk => {
    const d = await fetchYahoo(tk);
    if (d) { raw[tk] = d; ok++; }
  }));

  if (ok < 3) {
    badge.className = 'badge badge-sim';
    badge.innerHTML = '⚠ Live fetch failed — using embedded data';
    document.getElementById('fsrc').textContent = 'Simulated (Brownian bridge, 2026-03-20)';
    render(); return;
  }

  const today = new Date().toISOString().slice(0,10);
  const newST = ES.map(s => {
    const lv = raw[s.ticker];
    if (!lv) return s;
    const dec31 = D0[s.ticker];
    const dates  = ['2025-12-31', ...lv.dates];
    const prices = [dec31, ...lv.prices];
    const ytd_pct = prices.map(p => Math.round((p/dec31-1)*10000)/100);
    const last = prices[prices.length-1];
    return {...s, dates, prices, ytd_pct, end:last, ytd: ytd_pct[ytd_pct.length-1]};
  });
  newST.sort((a,b)=>b.ytd-a.ytd);
  newST.forEach((s,i)=>s.rank=i+1);

  const vl = raw['VOO'];
  let newBM = EB;
  if (vl) {
    const dec31 = D0['VOO'];
    const dates  = ['2025-12-31',...vl.dates];
    const prices = [dec31,...vl.prices];
    const ytd_pct = prices.map(p=>Math.round((p/dec31-1)*10000)/100);
    newBM = {...EB,dates,prices,ytd_pct,end:prices[prices.length-1],ytd:ytd_pct[ytd_pct.length-1]};
  }

  ST = newST; BM = newBM;
  document.getElementById('asof').textContent = today;
  document.getElementById('fdate').textContent = today;
  document.getElementById('fsrc').textContent = `Yahoo Finance (live) · ${ok}/${TICKERS.length} tickers`;
  badge.className = 'badge badge-live';
  badge.innerHTML = `✅ Live · ${ok}/${TICKERS.length} tickers · ${today}`;
  render();
}

    const col=C[i],pos=s.ytd>=0;
    const d=document.createElement('div');
    d.className='card'; d.id=`c-${s.ticker}`;
    d.innerHTML=`<div class="ch">
      <div><div class="ct" style="color:${col}">${s.ticker}</div>
        <div class="cn">${s.name}</div><div class="cs">${s.sector}</div></div>
      <div class="cr"><div class="cy" style="color:${pos?'#22c55e':'#ef4444'}">${pos?'+':''}${s.ytd.toFixed(2)}%</div>
        <div class="cp">$${s.start} → $${s.end.toLocaleString()}</div>
        <div class="ck">Rank #${s.rank} / 13</div></div></div>
      <div id="g-${s.ticker}" style="height:180px"></div>`;
    g.appendChild(d);
    const cl={...BL,margin:{t:4,b:28,l:42,r:10},showlegend:false,hovermode:'x',
      xaxis:{gridcolor:'#2e3347',linecolor:'#2e3347',tickfont:{size:9}},
      yaxis:{gridcolor:'#2e3347',linecolor:'#2e3347',ticksuffix:'%',zeroline:true,zerolinecolor:'#4b5563'}};
    Plotly.newPlot(`g-${s.ticker}`,[
      {x:BM.dates,y:BM.ytd_pct,name:'VOO',type:'scatter',mode:'lines',
        line:{color:'#4b5563',width:1.2,dash:'dot'},hovertemplate:`VOO: %{y:.2f}%<extra></extra>`},
      {x:s.dates,y:s.ytd_pct,name:s.ticker,type:'scatter',mode:'lines',fill:'tozeroy',
        fillcolor:pos?'rgba(34,197,94,.08)':'rgba(239,68,68,.08)',
        line:{color:col,width:2},hovertemplate:`${s.ticker}: %{y:.2f}%<extra></extra>`}
    ],cl,{responsive:true,displayModeBar:false});
  });
}

function goto(t){document.getElementById(`c-${t}`)?.scrollIntoView({behavior:'smooth',block:'center'})}

render();
loadLive();
</script>
</body>
</html>
